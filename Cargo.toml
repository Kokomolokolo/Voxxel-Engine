[package]
name = "Voxxel-Engine"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.16"
noise = "0.9"
rand = { version = "0.8" }


[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[profile.dev.package."*"]
opt-level = 3

# [profile.release]
# opt-level = 'z'     # Optimiere für Größe
# lto = "fat"         # Link Time Optimization
# codegen-units = 1   # Bessere Optimierung, langsamerer Build
# strip = true        # Symbole entfernen